<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectrum Player</title>
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <h1>Spectrum Player</h1>
        <p id="now-playing">No track loaded</p>
      </header>

      <div id="canvas-host" aria-hidden="true"></div>

      <footer class="controls">
        <button type="button" id="play" aria-label="Play">Play</button>

        <label class="control">
          <span>Volume</span>
          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
            disabled
            aria-label="Volume"
          />
        </label>

        <label class="control file">
          <span>Import</span>
          <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4,.opus" />
        </label>
      </footer>

      <p id="status" role="status"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
