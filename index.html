<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Spectrum Player · 3D Audio Visualizer</title>
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div class="brand">
          <h1>Spectrum Player</h1>
          <p id="now-playing">No track loaded</p>
        </div>

        <div class="header-options">
          <label class="control-inline">
            <span>Mode</span>
            <select id="mode-select" aria-label="Visualizer Mode">
              <option value="bars">3D Bars</option>
              <option value="radial">3D Radial</option>
              <option value="particles">3D Particles</option>
              <option value="orb">3D Shader Orb</option>
              <option value="lava">Lumina Lava</option>
              <option value="2d">2D Canvas</option>
            </select>
          </label>

          <label class="control-inline">
            <span>Color</span>
            <select id="color-select" aria-label="Color Palette">
              <option value="spectrum">Spectrum</option>
              <option value="mood">Mood</option>
              <option value="mono">Mono</option>
            </select>
          </label>
        </div>
      </header>

      <main id="canvas-host" aria-hidden="true"></main>

      <footer class="controls">
        <div class="playback-bar">
          <button type="button" id="prev-track" aria-label="Previous track">Prev</button>
          <button type="button" id="play" aria-label="Play">Play</button>
          <button type="button" id="next-track" aria-label="Next track">Next</button>
          
          <div class="seek-container">
            <input
              type="range"
              id="seek"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Seek track position"
            />
            <span id="time-display">0:00 / 0:00</span>
          </div>
        </div>

        <div class="settings-bar">
          <div class="control-group">
            <button type="button" id="mute" aria-label="Toggle mute">Mute</button>
            <button type="button" id="loop" aria-label="Toggle loop playback" aria-pressed="false">Loop: Off</button>
            <label class="control">
              <span>Volume</span>
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                aria-label="Volume"
              />
            </label>
          </div>

          <div class="control-group">
            <label class="control">
              <span>Gain</span>
              <input
                type="range"
                id="sensitivity"
                min="0.5"
                max="2.0"
                step="0.1"
                value="1.0"
                aria-label="Visualizer sensitivity"
              />
            </label>
          </div>

          <div class="control-group viz-settings">
            <label class="control">
              <span>Bars</span>
              <select id="bar-count" aria-label="Bar count">
                <option value="32">32</option>
                <option value="48">48</option>
                <option value="64">64</option>
                <option value="96">96</option>
                <option value="128">128</option>
              </select>
            </label>
            <label class="control">
              <span>FFT</span>
              <select id="fft-size" aria-label="FFT size">
                <option value="512">512</option>
                <option value="1024">1024</option>
                <option value="2048">2048</option>
              </select>
            </label>
            <label class="control" id="lava-speed-control">
              <span>Lava Speed</span>
              <input
                type="range"
                id="lava-speed"
                min="0.1"
                max="1.5"
                step="0.05"
                value="0.8"
                aria-label="Lava Lamp speed"
              />
            </label>
            <label class="control">
              <span>Motion</span>
              <select id="reduced-motion" aria-label="Reduced motion">
                <option value="system">System</option>
                <option value="off">Full motion</option>
                <option value="on">Reduce</option>
              </select>
            </label>
            <label class="control checkbox">
              <input type="checkbox" id="auto-rotate" checked />
              <span>Auto-rotate</span>
            </label>
            <label class="control" id="auto-rotate-speed-control">
              <span>Rotate Speed</span>
              <input
                type="range"
                id="auto-rotate-speed"
                min="0.1"
                max="3.0"
                step="0.1"
                value="1.0"
                aria-label="Auto rotate speed"
              />
            </label>
          </div>

          <div class="control-group file-group">
            <label class="control file">
              <span class="btn-import">Import Audio</span>
              <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4,.opus" aria-label="Import audio file" />
            </label>
          </div>

          <div class="control-group library-group">
            <label class="control">
              <span>Library</span>
              <select id="library-select" aria-label="Audio Library">
                <option value="demo">Demo Track (pulse.mp3)</option>
              </select>
            </label>
            <button type="button" id="delete-track" style="display: none;" aria-label="Delete imported track">Delete</button>
          </div>

          <div class="control-group tools-group">
            <button type="button" id="export-settings" title="Export Settings JSON" aria-label="Export settings to JSON file">Export JSON</button>
            <button type="button" id="import-settings-btn" title="Import Settings JSON" aria-label="Import settings from JSON file">Import JSON</button>
            <input type="file" id="import-settings-file" accept=".json,application/json" style="display: none;" aria-label="Select settings JSON file" />
            <button type="button" id="reset-settings" title="Reset settings to default" aria-label="Reset settings to defaults">Reset Settings</button>
            <button type="button" id="clear-library" title="Clear imported library" aria-label="Clear audio library">Clear Library</button>
          </div>
        </div>
      </footer>

      <div class="status-bar">
        <p id="status" role="status" aria-live="polite">Ready to play.</p>
        <span id="storage-info">Storage: 0 / 0 MB</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
