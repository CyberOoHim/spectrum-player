<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spectrum Player · 3D Audio Visualizer</title>
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div class="brand">
          <h1>Spectrum Player</h1>
          <p id="now-playing">No track loaded</p>
        </div>

        <div class="header-options">
          <label class="control-inline">
            <span>Mode</span>
            <select id="mode-select" aria-label="Visualizer Mode">
              <option value="bars">3D Bars</option>
              <option value="radial">3D Radial</option>
              <option value="particles">3D Particles</option>
              <option value="2d">2D Canvas</option>
            </select>
          </label>

          <label class="control-inline">
            <span>Color</span>
            <select id="color-select" aria-label="Color Palette">
              <option value="spectrum">Spectrum</option>
              <option value="mood">Mood</option>
              <option value="mono">Cyan Mono</option>
            </select>
          </label>
        </div>
      </header>

      <main id="canvas-host" aria-hidden="true"></main>

      <footer class="controls">
        <div class="playback-bar">
          <button type="button" id="play" aria-label="Play">Play</button>
          
          <div class="seek-container">
            <input
              type="range"
              id="seek"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Seek track position"
            />
            <span id="time-display">0:00 / 0:00</span>
          </div>
        </div>

        <div class="settings-bar">
          <div class="control-group">
            <button type="button" id="mute" aria-label="Toggle mute">Mute</button>
            <label class="control">
              <span>Volume</span>
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                aria-label="Volume"
              />
            </label>
          </div>

          <div class="control-group">
            <label class="control">
              <span>Gain</span>
              <input
                type="range"
                id="sensitivity"
                min="0.5"
                max="2.0"
                step="0.1"
                value="1.0"
                aria-label="Visualizer sensitivity"
              />
            </label>
          </div>

          <div class="control-group file-group">
            <label class="control file">
              <span class="btn-import">Import Audio</span>
              <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4,.opus" />
            </label>
          </div>

          <div class="control-group library-group">
            <label class="control">
              <span>Library</span>
              <select id="library-select" aria-label="Audio Library">
                <option value="demo">Demo Track (pulse.mp3)</option>
              </select>
            </label>
            <button type="button" id="delete-track" style="display: none;" aria-label="Delete imported track">Delete</button>
          </div>
        </div>
      </footer>

      <div class="status-bar">
        <p id="status" role="status">Ready to play.</p>
        <span id="storage-info">Storage: 0 MB used</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
