<!doctype html>
<html lang="en" data-theme="sunset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f17" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Spectrum Player · Ambient 3D Audio Visualizer</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <!-- Top Chrome Header -->
      <header class="chrome">
        <div class="brand">
          <div class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M9 14.5V9.5L16 12L9 14.5Z" fill="currentColor" stroke="none" />
              <path d="M12 3v3m0 12v3M3 12h3m12 0h3" opacity="0.4" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>Spectrum Player</h1>
            <div class="now-playing-pill" title="Currently active track">
              <span class="pulse-dot" id="soundwave-dot"></span>
              <span id="now-playing">No track loaded</span>
            </div>
          </div>
        </div>

        <div class="header-options">
          <label class="control-inline" title="Change Visualizer Renderer">
            <span class="label-text">Visual Mode</span>
            <div class="select-wrapper">
              <select id="mode-select" aria-label="Visualizer Mode">
                <optgroup label="Spectrum">
                  <option value="bars">3D Bars</option>
                  <option value="radial">3D Radial</option>
                  <option value="particles">3D Particles</option>
                  <option value="orb">3D Shader Orb</option>
                  <option value="2d">2D Canvas</option>
                </optgroup>
                <optgroup label="Atmosphere">
                  <option value="lava">Lumina Lava</option>
                  <option value="hearth">Ember Hearth</option>
                </optgroup>
              </select>
              <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </div>
          </label>

          <label class="control-inline" title="Visual Color Theme">
            <span class="label-text">Palette</span>
            <div class="select-wrapper">
              <select id="color-select" aria-label="Color Palette">
                <option value="spectrum">Spectrum</option>
                <option value="mood">Mood</option>
                <option value="mono">Mono</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </div>
          </label>

          <button type="button" id="settings-toggle" class="btn-icon" title="Customize Audio & Visual Settings" aria-label="Open Settings Drawer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span class="btn-text">Settings</span>
          </button>
        </div>
      </header>

      <!-- Main Visualizer Viewport -->
      <main id="canvas-host" aria-hidden="true">
        <!-- Ambient Stage Glow Overlay -->
        <div class="ambient-glow" aria-hidden="true"></div>

        <!-- Canvas Floating Controls -->
        <div class="canvas-floating-actions">
          <button type="button" id="fullscreen-btn" class="btn-floating-icon" title="Toggle Fullscreen" aria-label="Fullscreen View">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>

        <!-- Drag & Drop Audio Hint Overlay -->
        <div id="drop-overlay" class="drop-overlay">
          <div class="drop-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <h3>Drop Audio Track Here</h3>
            <p>MP3, WAV, FLAC, M4A, OGG supported</p>
          </div>
        </div>
      </main>

      <!-- Floating Cozy Audio Player Bar -->
      <footer class="controls">
        <!-- Top Row: Playback & Seekbar -->
        <div class="playback-bar">
          <div class="transport-group">
            <button type="button" id="prev-track" class="btn-transport" aria-label="Previous track" title="Previous Track (P)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button type="button" id="play" class="btn-play" aria-label="Play" title="Play / Pause (Space)">
              <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button type="button" id="next-track" class="btn-transport" aria-label="Next track" title="Next Track (N)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>

          <div class="seek-container">
            <input
              type="range"
              id="seek"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Seek track position"
            />
            <span id="time-display">0:00 / 0:00</span>
          </div>
        </div>

        <!-- Bottom Row: Audio Controls, Track Selector & Settings Toggle -->
        <div class="settings-bar">
          <div class="control-group volume-group">
            <button type="button" id="mute" class="btn-icon-subtle" aria-label="Toggle mute" title="Mute / Unmute (M)">
              <svg class="icon-vol-high" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg class="icon-vol-muted hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <label class="control volume-slider-label" title="Volume (Up/Down)">
              <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
                aria-label="Volume"
              />
            </label>
            <button type="button" id="loop" class="btn-pill" aria-label="Toggle loop playback" aria-pressed="false" title="Loop Playback (L)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
              <span>Loop</span>
            </button>
          </div>

          <div class="control-group library-group">
            <label class="control file" title="Import local audio file">
              <span class="btn-import">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 11 15 14"/></svg>
                Import
              </span>
              <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4,.opus" aria-label="Import audio file" />
            </label>

            <div class="select-wrapper library-select-wrapper">
              <select id="library-select" aria-label="Audio Library">
                <option value="demo">Demo Track (pulse.mp3)</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            </div>
            <button type="button" id="delete-track" class="btn-danger-subtle" style="display: none;" aria-label="Delete imported track" title="Delete Track from Library">Delete</button>
          </div>
        </div>
      </footer>

      <!-- Collapsible Settings Drawer -->
      <div id="settings-drawer" class="drawer-backdrop hidden" aria-hidden="true">
        <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Audio and Visual Settings">
          <div class="drawer-header">
            <div class="drawer-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              <h2>Settings & Customization</h2>
            </div>
            <button type="button" id="close-drawer" class="btn-close" aria-label="Close Settings Drawer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div class="drawer-content">
            <section class="drawer-section">
              <h3>Visual Fine-Tuning</h3>
              <div class="drawer-grid">
                <label class="control-card">
                  <span class="card-label">Sensitivity / Gain</span>
                  <input
                    type="range"
                    id="sensitivity"
                    min="0.5"
                    max="2.0"
                    step="0.1"
                    value="1.0"
                    aria-label="Visualizer sensitivity"
                  />
                </label>

                <label class="control-card">
                  <span class="card-label">Bar Count</span>
                  <div class="select-wrapper">
                    <select id="bar-count" aria-label="Bar count">
                      <option value="32">32 (Cozy)</option>
                      <option value="48">48</option>
                      <option value="64">64 (Balanced)</option>
                      <option value="96">96</option>
                      <option value="128">128 (Detailed)</option>
                    </select>
                    <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                  </div>
                </label>

                <label class="control-card">
                  <span class="card-label">FFT Audio Resolution</span>
                  <div class="select-wrapper">
                    <select id="fft-size" aria-label="FFT size">
                      <option value="512">512 Fast</option>
                      <option value="1024">1024 Smooth</option>
                      <option value="2048">2048 High Res</option>
                    </select>
                    <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                  </div>
                </label>

                <label class="control-card" id="scene-speed-control">
                  <span class="card-label" id="scene-speed-label">Atmosphere speed</span>
                  <input
                    type="range"
                    id="scene-speed"
                    min="0.1"
                    max="1.5"
                    step="0.05"
                    value="0.8"
                    aria-label="Atmosphere speed"
                  />
                </label>

                <label class="control-card">
                  <span class="card-label">Motion Comfort</span>
                  <div class="select-wrapper">
                    <select id="reduced-motion" aria-label="Reduced motion">
                      <option value="system">Follow System</option>
                      <option value="off">Full Motion</option>
                      <option value="on">Reduced Motion</option>
                    </select>
                    <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                  </div>
                </label>

                <div class="control-card checkbox-card">
                  <label class="checkbox-label">
                    <input type="checkbox" id="auto-rotate" checked />
                    <span>Camera Auto-Rotate</span>
                  </label>
                  <div class="nested-range" id="auto-rotate-speed-control">
                    <span class="sub-label">Speed</span>
                    <input
                      type="range"
                      id="auto-rotate-speed"
                      min="0.1"
                      max="3.0"
                      step="0.1"
                      value="1.0"
                      aria-label="Auto rotate speed"
                    />
                  </div>
                </div>
              </div>
            </section>

            <section class="drawer-section">
              <h3>Data & Presets</h3>
              <div class="tools-grid">
                <button type="button" id="export-settings" class="btn-drawer-action" title="Export Settings JSON" aria-label="Export settings to JSON file">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  Export Preset
                </button>
                <button type="button" id="import-settings-btn" class="btn-drawer-action" title="Import Settings JSON" aria-label="Import settings from JSON file">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  Import Preset
                </button>
                <input type="file" id="import-settings-file" accept=".json,application/json" style="display: none;" aria-label="Select settings JSON file" />
                
                <button type="button" id="reset-settings" class="btn-drawer-action warning" title="Reset settings to default" aria-label="Reset settings to defaults">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                  Reset Settings
                </button>
                <button type="button" id="clear-library" class="btn-drawer-action danger" title="Clear imported library" aria-label="Clear audio library">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  Clear Library
                </button>
              </div>
            </section>
          </div>
        </div>
      </div>

      <!-- Toast Status Bar -->
      <div id="status-bar" class="status-bar" role="status" aria-live="polite">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span id="status">Ready to play.</span>
        </div>
        <span id="storage-info">Storage: 0 / 0 MB</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
